# =============================================================================
# Config: English → Assamese RLFT Pipeline — V9 (Iterative DPO, 200M)
# Model: ai4bharat/indictrans2-en-indic-dist-200M
# Best overall 320M config from Hindi-Maithili V9 (BLEU 39.47)
# Iterative DPO: Round 1 uses SFT model, Round 2 uses V7 DPO adapter
# =============================================================================

experiment_name: eng-asm-v9
src_lang: eng_Latn
tgt_lang: asm_Beng

# --- Data paths ---
train_src: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/data2/train/train.eng_Latn
train_tgt: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/data2/train/train.asm_Beng
valid_src: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/data2/valid/valid.eng_Latn
valid_tgt: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/data2/valid/valid.asm_Beng
test_src: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/data2/test/test.eng_Latn
test_tgt: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/data2/test/test.asm_Beng
test_dir: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/data2/test

# --- Model ---
model_name: ai4bharat/indictrans2-en-indic-dist-200M

# --- LoRA ---
lora_r: 8
lora_alpha: 16
lora_target_modules:
  - q_proj
lora_dropout: 0.1

# --- SFT Training --- (REUSE V7 SFT adapter — no need to retrain)
max_length: 128
batch_size: 16
eval_batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 0.0003
warmup_steps: 300
sft_epochs: 5
fp16: false
bf16: false

# --- Candidate Generation ---
k_candidates: 2
rl_samples: 2000
gen_max_new_tokens: 192

# --- Evaluation COMET model ---
comet_model: Unbabel/wmt22-comet-da

# --- DPO Training ---
dpo_beta: 0.1
dpo_learning_rate: 0.00001
dpo_epochs: 3
dpo_batch_size: 4
dpo_gradient_accumulation: 4
dpo_max_length: 256
dpo_max_prompt_length: 128
dpo_max_target_length: 128
dpo_loss_type: sigmoid

# --- Output paths ---
output_dir: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/models2/eng-asm-v9
sft_adapter_dir: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/models2/eng-asm-v7/sft_lora_adapter
dpo_adapter_dir: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/models2/eng-asm-v9/dpo_lora_adapter
candidates_file: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/models2/eng-asm-v9/rl_candidates.csv
scored_file: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/models2/eng-asm-v9/rl_scored.csv
results_file: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/models2/eng-asm-v9/eval_results.json
log_dir: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/models2/eng-asm-v9/logs

# --- V9 KEY: use V7 DPO adapter as generation model for Round 2 ---
generation_adapter_dir: /mnt/storage/boynao/aditya/exp2/rlft-eng-asm/models2/eng-asm-v7/dpo_lora_adapter